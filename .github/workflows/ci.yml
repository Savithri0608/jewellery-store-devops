
name: Jewellery Store CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/savithri0608/jewellery-store-devops:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            docker pull ghcr.io/savithri0608/jewellery-store-devops:latest

            docker rm -f jewellery-store-new 2>/dev/null || true

            docker run -d \
              --name jewellery-store-new \
              --restart unless-stopped \
              -p 8080:3000 \
              --env-file /home/ubuntu/.env.local \
              ghcr.io/savithri0608/jewellery-store-devops:latest

            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8080/ > /dev/null; then
                break
              fi
              sleep 5
            done

            if ! curl -fsS http://localhost:8080/ > /dev/null; then
              docker logs jewellery-store-new
              docker rm -f jewellery-store-new
              exit 1
            fi

            docker stop jewellery-store || true
            docker rm jewellery-store || true

            docker stop jewellery-store-new
            docker rm jewellery-store-new

            docker run -d \
              --name jewellery-store \
              --restart unless-stopped \
              -p 80:3000 \
              --env-file /home/ubuntu/.env.local \
              ghcr.io/savithri0608/jewellery-store-devops:latest
